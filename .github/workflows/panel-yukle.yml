name: Paneli yükle

# worker/ klasörü değişince (veya elle başlatınca) paneli Cloudflare'e yükler.
# Veritabanı yoksa oluşturur, tabloları hazırlar, gizli değerleri GitHub Secrets'tan aktarır.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/panel-yukle.yml']

concurrency:
  group: panel-yukle
  cancel-in-progress: false

jobs:
  yukle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - name: Cloudflare anahtarını hazırla
        env:
          RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Yapıştırırken araya giren boşluk/satır sonlarını temizle
        run: |
          T=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ -z "$T" ]; then echo "CLOUDFLARE_API_TOKEN GitHub Secrets içinde yok"; exit 1; fi
          echo "::add-mask::$T"
          echo "CLOUDFLARE_API_TOKEN=$T" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save wrangler@4

      - name: Veritabanını hazırla
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(d=>d.name==="urun-takip")?.uuid??"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create urun-takip
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(d=>d.name==="urun-takip")?.uuid??"")')
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          # Tablolar ve sonraki güncellemeler (worker/migrations) sırayla uygulanır
          npx wrangler d1 migrations apply urun-takip --remote

      - name: Paneli yükle
        run: npx wrangler deploy

      - name: Gizli değerleri aktar
        env:
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          node -e 'const s={};for(const k of ["PANEL_PASSWORD","API_TOKEN","DISPATCH_TOKEN"]){if(!process.env[k])throw new Error(k+" GitHub Secrets içinde yok");s[k]=process.env[k].trim()}require("fs").writeFileSync("/tmp/gizli.json",JSON.stringify(s))'
          npx wrangler secret bulk /tmp/gizli.json
          rm -f /tmp/gizli.json
