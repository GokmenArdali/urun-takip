name: Site testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: headless
            channel: ''
          - mode: headed
            channel: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test (${{ matrix.mode }})
        env:
          MODE: ${{ matrix.mode }}
          CHANNEL: ${{ matrix.channel }}
          OUT: out/${{ matrix.mode }}
        run: |
          if [ "$MODE" = "headed" ]; then
            xvfb-run --auto-servernum node test.mjs
          else
            node test.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.mode }}
          path: out/${{ matrix.mode }}

  # Sonuçları depoya kaydeder, böylece bilgisayardan okunabilir
  save:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results/run-${{ github.run_number }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Test sonuçları #${{ github.run_number }}"
          git push
